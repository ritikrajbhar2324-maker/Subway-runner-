<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Runner Mini Game</title>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
    body {
      background: #111827;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
    }
    #top-bar {
      width: 100%;
      max-width: 480px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1f2937;
      font-size: 16px;
      font-weight: 700;
    }
    canvas {
      background: linear-gradient(#38bdf8, #bae6fd 70%, #4b5563 70%, #1f2937);
      width: 100%;
      max-width: 480px;
      height: 62vh;
      display: block;
    }
    #controls {
      width: 100%;
      max-width: 480px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 10px;
      background: #1f2937;
    }
    button.ctrl {
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
    }
    button.ctrl:active { background: #1d4ed8; }
    #ad-slot {
      width: 100%;
      max-width: 480px;
      min-height: 54px;
      background: #0f172a;
      border-top: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #94a3b8;
      padding: 6px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="top-bar">
    <span>Score: <span id="score">0</span></span>
    <span>Best: <span id="best">0</span></span>
  </div>

  <canvas id="game" width="480" height="600"></canvas>

  <div id="controls">
    <button class="ctrl" id="btn-jump">JUMP</button>
    <button class="ctrl" id="btn-duck">DUCK</button>
  </div>

  <div id="ad-slot">AdsGram Interstitial Active (int-61505)</div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const adSlot = document.getElementById("ad-slot");

    const ADSGRAM_BLOCK_ID = "int-61505";
    let adController = null;

    if (window.AdsGram && typeof window.AdsGram.init === "function") {
      try {
        adController = window.AdsGram.init({ blockId: ADSGRAM_BLOCK_ID });
      } catch (e) {
        adController = null;
      }
    }

    const groundY = 470;
    let best = 0;
    try {
      best = Number(localStorage.getItem("runner_best") || 0);
    } catch (e) {
      best = 0;
    }
    bestEl.textContent = best;

    let player = { x: 80, y: groundY - 50, w: 40, h: 50, vy: 0, onGround: true };
    let obstacles = [];
    let score = 0;
    let speed = 5;
    let gameOver = false;
    let ducking = false;
    let adShowing = false;
    let spawnTimer = 0;

    function resetGame() {
      player = { x: 80, y: groundY - 50, w: 40, h: 50, vy: 0, onGround: true };
      obstacles = [];
      score = 0;
      speed = 5;
      gameOver = false;
      ducking = false;
      adShowing = false;
      spawnTimer = 0;
      scoreEl.textContent = 0;
    }

    function restartWithAd() {
      if (adShowing) return;

      if (!adController || typeof adController.show !== "function") {
        adSlot.textContent = "Ad controller unavailable, restarting...";
        resetGame();
        return;
      }

      adShowing = true;
      adSlot.textContent = "Loading ad (int-61505)...";

      adController
        .show()
        .then(() => {
          adSlot.textContent = "Ad shown (int-61505)";
          resetGame();
        })
        .catch((err) => {
          adSlot.textContent = "No ad fill: " + (err?.description || err?.message || "restarted");
          resetGame();
        });
    }

    function jump() {
      if (gameOver) {
        restartWithAd();
        return;
      }
      if (player.onGround) {
        player.vy = -14;
        player.onGround = false;
      }
    }

    function setDuck(active) {
      if (gameOver) return;
      ducking = active;
      if (player.onGround) {
        player.h = active ? 28 : 50;
        player.y = groundY - player.h;
      }
    }

    document.getElementById("btn-jump").addEventListener("pointerdown", jump);
    const duckBtn = document.getElementById("btn-duck");
    duckBtn.addEventListener("pointerdown", () => setDuck(true));
    duckBtn.addEventListener("pointerup", () => setDuck(false));
    duckBtn.addEventListener("pointerleave", () => setDuck(false));
    canvas.addEventListener("pointerdown", jump);

    function spawnObstacle() {
      const high = Math.random() > 0.65;
      obstacles.push({
        x: canvas.width + 20,
        y: high ? groundY - 82 : groundY - 40,
        w: 32,
        h: high ? 32 : 40
      });
    }

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!gameOver) {
        score++;
        if (score % 250 === 0) speed += 0.5;
        scoreEl.textContent = score;

        if (score > best) {
          best = score;
          bestEl.textContent = best;
          try {
            localStorage.setItem("runner_best", best);
          } catch (e) {}
        }

        if (!player.onGround) {
          player.vy += 0.75;
          player.y += player.vy;
          if (player.y >= groundY - player.h) {
            player.y = groundY - player.h;
            player.vy = 0;
            player.onGround = true;
            if (ducking) {
              player.h = 28;
              player.y = groundY - player.h;
            }
          }
        }

        spawnTimer++;
        if (spawnTimer > 75) {
          spawnObstacle();
          spawnTimer = 0;
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const ob = obstacles[i];
          ob.x -= speed;

          const hit =
            player.x < ob.x + ob.w &&
            player.x + player.w > ob.x &&
            player.y < ob.y + ob.h &&
            player.y + player.h > ob.y;

          if (hit) gameOver = true;
          if (ob.x + ob.w < 0) obstacles.splice(i, 1);
        }
      }

      ctx.fillStyle = "#374151";
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

      ctx.fillStyle = "#ef4444";
      ctx.fillRect(player.x, player.y, player.w, player.h);

      ctx.fillStyle = "#111827";
      for (const ob of obstacles) {
        ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
      }

      if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.65)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 28px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 15);
        ctx.font = "18px sans-serif";
        ctx.fillText("Tap to Restart", canvas.width / 2, canvas.height / 2 + 22);
      }

      requestAnimationFrame(loop);
    }

    resetGame();
    loop();
  </script>
</body>
</html>
